<style>
  :root{
    --navy:#1B2A4A; --navy-soft:#3A4A6B; --navy-faint:#EEF1F7; --navy-line:#C7CEDD; --gold:#B08D3F;
    --ee:#1B7A4A; --me:#1B5A8A; --ae:#B08D3F; --be:#A3402F; --gray:#9AA3B5;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:Georgia,'Times New Roman',serif;background:#fff;color:var(--navy);}
  header{border-bottom:1px solid var(--navy);}
  .wrap{max-width:1000px;margin:0 auto;padding:0 16px;}
  .headrow{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:14px 0;}
  .brand{display:flex;align-items:center;gap:10px;}
  .logo-badge{width:42px;height:42px;border-radius:50%;border:2px solid var(--navy);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;background:#fff;flex-shrink:0;}
  .logo-badge img{width:100%;height:100%;object-fit:cover;}
  h1{font-size:19px;margin:0;font-weight:bold;letter-spacing:.3px;}
  .subtitle{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--navy-soft);margin:2px 0 0;}
  .save-status{font-size:11px;color:var(--navy-soft);display:flex;align-items:center;gap:4px;}
  nav{display:flex;gap:2px;overflow-x:auto;}
  nav button{background:none;border:none;border-bottom:2px solid transparent;padding:10px 14px;font-size:13px;font-weight:600;color:var(--navy-line);cursor:pointer;white-space:nowrap;font-family:inherit;}
  nav button.active{color:var(--navy);border-color:var(--navy);}
  main{max-width:1000px;margin:0 auto;padding:20px 16px 60px;}
  .btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:2px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;background:var(--navy);color:#fff;}
  .btn.outline{background:#fff;border:1px solid var(--navy);color:var(--navy);}
  .btn.sm{padding:6px 10px;font-size:12px;}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .between{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  label.field-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--navy-soft);display:block;margin-bottom:4px;}
  input[type=text], input[type=number], select, input.plain{font-family:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--navy-line);border-radius:2px;color:var(--navy);background:#fff;}
  .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;}
  .card{border:1px solid var(--navy-line);border-radius:2px;padding:10px;display:flex;align-items:center;gap:10px;}
  .avatar{width:40px;height:40px;border-radius:50%;background:var(--navy-faint);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;border:1px solid var(--navy-line);flex-shrink:0;overflow:hidden;cursor:pointer;}
  .avatar img{width:100%;height:100%;object-fit:cover;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  thead tr{background:var(--navy);color:#fff;}
  th,td{padding:7px 8px;text-align:left;border-top:1px solid var(--navy-line);}
  th{border-top:none;}
  tr.zebra{background:var(--navy-faint);}
  /* Reports/exports stay light &#8212; navy text and thin borders on white,
     no dark fills, so they photocopy/print cleanly for official use. */
  #printable thead tr{background:#fff;color:var(--navy);}
  #printable th{border-bottom:2px solid var(--navy);font-weight:700;}
  /* Mark-list cells never wrap onto a second line &#8212; a wrapped name or
     "545/800" split across lines is what was inflating row heights and
     pushing a 30-row class list onto 2-3 pages instead of one. */
  #printable table th, #printable table td{white-space:nowrap;}
  .grade-pill{display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;padding:1px 7px;border-radius:2px;min-width:28px;border:1px solid;}
  .pos{font-size:12px;font-weight:700;}
  .chart-card{border:1px solid var(--navy-line);border-radius:2px;padding:10px;margin-bottom:14px;}
  .chart-card h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--navy-soft);margin:0 0 8px;}
  .barchart{display:flex;align-items:flex-end;gap:6px;height:160px;padding-top:10px;}
  .bar-col{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0;}
  .bar{width:70%;min-height:2px;background:var(--navy);border-radius:2px 2px 0 0;}
  .bar-val{font-size:9px;color:var(--navy-soft);margin-bottom:2px;}
  .bar-label{font-size:8px;color:var(--navy-soft);margin-top:4px;writing-mode:vertical-rl;text-orientation:mixed;max-height:60px;overflow:hidden;}
  .empty{border:1px dashed var(--navy-line);border-radius:2px;padding:50px 20px;text-align:center;color:var(--navy-soft);font-size:13px;}
  .term-icons{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
  .term-icon{display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px 18px;border:1px solid var(--navy-line);border-radius:2px;cursor:pointer;min-width:90px;background:#fff;font-family:inherit;}
  .term-icon.active{background:var(--navy);border-color:var(--navy);border-width:2px;}
  .term-icon.active span{color:#fff !important;}
  .term-icon span{font-size:12px;font-weight:600;color:var(--navy);}
  .term-icon small{font-size:9px;color:var(--navy-line);}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
  .modal-box{background:#fff;border:1px solid var(--navy-line);border-radius:2px;padding:20px;width:100%;max-width:380px;}
  .modal-box.wide{max-width:640px;max-height:90vh;overflow-y:auto;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .subject-teacher-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:10px;}
  .subject-teacher-row{display:flex;align-items:center;gap:8px;border:1px solid var(--navy-line);border-radius:2px;padding:8px;}
  .subject-teacher-row span{font-size:11px;font-weight:700;width:90px;flex-shrink:0;}
  .subject-teacher-row input{flex:1;border:none;border-bottom:1px solid var(--navy-line);background:transparent;min-width:0;}
  .icon{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0;}
  .expand-panel{background:var(--navy-faint);}
  .subj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
  .subj-field label{font-size:9px;text-transform:uppercase;color:var(--navy-soft);display:block;margin-bottom:3px;}
  .subj-field input{width:70px;font-size:12px;padding:4px 6px;}
  .report-card{background:#fff;max-width:640px;width:100%;border:1px solid var(--navy-line);border-radius:2px;padding:24px;}
  .report-card.wide{padding:12px 8px;}
  .report-card.wide h2, .report-card.wide h1{margin-left:8px;margin-right:8px;}
  .report-card table{margin-bottom:14px;}
  .report-card th{font-size:10px;}
  .report-close-row{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px;}
  .print-only{display:none;}
  @media print{
    body > *:not(#reportRoot){display:none !important;}
    #reportRoot{display:block !important;}
    #reportRoot .modal-overlay{position:static !important;display:block !important;background:none !important;padding:0 !important;}
    #printable{width:100%;}
    .no-print{display:none !important;}
    .print-page-break{page-break-after:always;break-after:page;}
  }
  footer{max-width:1000px;margin:0 auto;padding:30px 16px;text-align:center;font-size:11px;color:var(--navy-line);}
  .small-note{font-size:11px;color:var(--navy-soft);margin-bottom:10px;}
  .delta-up{color:var(--ee);font-weight:700;}
  .delta-down{color:var(--be);font-weight:700;}
  .delta-flat{color:var(--navy-soft);}
</style>

/* =========================================================
   LIVE SYNC \u2014 via the Claude "db" runtime capability, so this
   artifact stays in sync across every device/browser where
   Caroline opens the same published link (Chrome on desktop
   included), instead of the old per-device-only localStorage.
========================================================= */
const SYNC_DOC_PATH = "sync/state";
const PENDING_SYNC_KEY = "bosiango-cloud-pending";
let SYNC_ENABLED = false; // becomes true once the db capability connects
let dbNS = null;
let dbUnsub = null;
let syncApplyingRemote = false; // guards against write-loop while applying a remote update
let cloudWriteChain = Promise.resolve();
let cloudWriteQueued = false;
// Marks typed while unsynced/offline are remembered individually, so when
// we reconnect and merge in what other teachers saved, OUR unsynced marks
// win for the boxes we touched and THEIR marks win everywhere else.
const PENDING_EDITS_KEY = "bosiango-pending-edits";
let pendingEdits = {};
let pendingSeq = 0;
try{
  pendingEdits = JSON.parse(localStorage.getItem(PENDING_EDITS_KEY) || "{}") || {};
  Object.values(pendingEdits).forEach(e => { if(e && e.v > pendingSeq) pendingSeq = e.v; });
}catch(e){ pendingEdits = {}; }
function savePendingEdits(){ try{ localStorage.setItem(PENDING_EDITS_KEY, JSON.stringify(pendingEdits)); }catch(e){} }
function recordPendingEdit(gradeName, asmId, stuId, subject, val){
  pendingSeq++;
  pendingEdits[[gradeName,asmId,stuId,subject].join("|")] = {g:gradeName, a:asmId, s:stuId, sub:subject, val:val, v:pendingSeq};
  savePendingEdits();
}
function reapplyPendingEdits(){
  Object.values(pendingEdits).forEach(e => {
    const g = state.grades[e.g]; if(!g) return;
    const asm = g.assessments.find(x => x.id === e.a); if(!asm) return;
    if(!asm.scores[e.s]) asm.scores[e.s] = {};
    if(e.val === null) delete asm.scores[e.s][e.sub]; else asm.scores[e.s][e.sub] = e.val;
  });
}
let cloudDirty = false; // true = local marks not yet confirmed saved to the shared copy
try{ cloudDirty = localStorage.getItem(PENDING_SYNC_KEY) === "1"; }catch(e){}
function markCloudDirty(){
  cloudDirty = true;
  try{ localStorage.setItem(PENDING_SYNC_KEY, "1"); }catch(e){}
}
function clearCloudDirty(){
  cloudDirty = false;
  try{ localStorage.removeItem(PENDING_SYNC_KEY); }catch(e){}
}
