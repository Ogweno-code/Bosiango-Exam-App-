<style>
  :root{
    --navy:#1B2A4A; --navy-soft:#3A4A6B; --navy-faint:#EEF1F7; --navy-line:#C7CEDD; --gold:#B08D3F;
    --ee:#1B7A4A; --me:#1B5A8A; --ae:#B08D3F; --be:#A3402F; --gray:#9AA3B5;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:Georgia,'Times New Roman',serif;background:#fff;color:var(--navy);}
  header{border-bottom:1px solid var(--navy);}
  .wrap{max-width:1000px;margin:0 auto;padding:0 16px;}
  .headrow{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:14px 0;}
  .brand{display:flex;align-items:center;gap:10px;}
  .logo-badge{width:42px;height:42px;border-radius:50%;border:2px solid var(--navy);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;background:#fff;flex-shrink:0;}
  .logo-badge img{width:100%;height:100%;object-fit:cover;}
  h1{font-size:19px;margin:0;font-weight:bold;letter-spacing:.3px;}
  .subtitle{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--navy-soft);margin:2px 0 0;}
  .save-status{font-size:11px;color:var(--navy-soft);display:flex;align-items:center;gap:4px;}
  nav{display:flex;gap:2px;overflow-x:auto;}
  nav button{background:none;border:none;border-bottom:2px solid transparent;padding:10px 14px;font-size:13px;font-weight:600;color:var(--navy-line);cursor:pointer;white-space:nowrap;font-family:inherit;}
  nav button.active{color:var(--navy);border-color:var(--navy);}
  main{max-width:1000px;margin:0 auto;padding:20px 16px 60px;}
  .btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:2px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;background:var(--navy);color:#fff;}
  .btn.outline{background:#fff;border:1px solid var(--navy);color:var(--navy);}
  .btn.sm{padding:6px 10px;font-size:12px;}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .between{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  label.field-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--navy-soft);display:block;margin-bottom:4px;}
  input[type=text], input[type=number], select, input.plain{font-family:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--navy-line);border-radius:2px;color:var(--navy);background:#fff;}
  .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;}
  .card{border:1px solid var(--navy-line);border-radius:2px;padding:10px;display:flex;align-items:center;gap:10px;}
  .avatar{width:40px;height:40px;border-radius:50%;background:var(--navy-faint);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;border:1px solid var(--navy-line);flex-shrink:0;overflow:hidden;cursor:pointer;}
  .avatar img{width:100%;height:100%;object-fit:cover;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  thead tr{background:var(--navy);color:#fff;}
  th,td{padding:7px 8px;text-align:left;border-top:1px solid var(--navy-line);}
  th{border-top:none;}
  tr.zebra{background:var(--navy-faint);}

     no dark fills, so they photocopy/print cleanly for official use. */
  #printable thead tr{background:#fff;color:var(--navy);}
  #printable th{border-bottom:2px solid var(--navy);font-weight:700;}
  .grade-pill{display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;padding:1px 7px;border-radius:2px;min-width:28px;border:1px solid;}
  .pos{font-size:12px;font-weight:700;}
  .chart-card{border:1px solid var(--navy-line);border-radius:2px;padding:10px;margin-bottom:14px;}
  .chart-card h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--navy-soft);margin:0 0 8px;}
  .barchart{display:flex;align-items:flex-end;gap:6px;height:160px;padding-top:10px;}
  .bar-col{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0;}
  .bar{width:70%;min-height:2px;background:var(--navy);border-radius:2px 2px 0 0;}
  .bar-val{font-size:9px;color:var(--navy-soft);margin-bottom:2px;}
  .bar-label{font-size:8px;color:var(--navy-soft);margin-top:4px;writing-mode:vertical-rl;text-orientation:mixed;max-height:60px;overflow:hidden;}
  .empty{border:1px dashed var(--navy-line);border-radius:2px;padding:50px 20px;text-align:center;color:var(--navy-soft);font-size:13px;}
  .term-icons{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
  .term-icon{display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px 18px;border:1px solid var(--navy-line);border-radius:2px;cursor:pointer;min-width:90px;background:#fff;font-family:inherit;}
  .term-icon.active{background:var(--navy);border-color:var(--navy);border-width:2px;}
  .term-icon.active span{color:#fff !important;}
  .term-icon span{font-size:12px;font-weight:600;color:var(--navy);}
  .term-icon small{font-size:9px;color:var(--navy-line);}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
  .modal-box{background:#fff;border:1px solid var(--navy-line);border-radius:2px;padding:20px;width:100%;max-width:380px;}
  .modal-box.wide{max-width:640px;max-height:90vh;overflow-y:auto;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .subject-teacher-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:10px;}
  .subject-teacher-row{display:flex;align-items:center;gap:8px;border:1px solid var(--navy-line);border-radius:2px;padding:8px;}
  .subject-teacher-row span{font-size:11px;font-weight:700;width:90px;flex-shrink:0;}
  .subject-teacher-row input{flex:1;border:none;border-bottom:1px solid var(--navy-line);background:transparent;min-width:0;}
  .icon{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0;}
  .expand-panel{background:var(--navy-faint);}
  .subj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
  .subj-field label{font-size:9px;text-transform:uppercase;color:var(--navy-soft);display:block;margin-bottom:3px;}
  .subj-field input{width:70px;font-size:12px;padding:4px 6px;}
  .report-card{background:#fff;max-width:640px;width:100%;border:1px solid var(--navy-line);border-radius:2px;padding:24px;}
  .report-card.wide{padding:12px 8px;}
  .report-card.wide h2, .report-card.wide h1{margin-left:8px;margin-right:8px;}
  .report-card table{margin-bottom:14px;}
  .report-card th{font-size:10px;}
  .report-close-row{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px;}
  .print-only{display:none;}
  @media print{
    body > *:not(#reportRoot){display:none !important;}
    #reportRoot{display:block !important;}
    #reportRoot .modal-overlay{position:static !important;display:block !important;background:none !important;padding:0 !important;}
    #printable{width:100%;}
    .no-print{display:none !important;}
    .print-page-break{page-break-after:always;break-after:page;}
  }
  footer{max-width:1000px;margin:0 auto;padding:30px 16px;text-align:center;font-size:11px;color:var(--navy-line);}
  .small-note{font-size:11px;color:var(--navy-soft);margin-bottom:10px;}
  .delta-up{color:var(--ee);font-weight:700;}
  .delta-down{color:var(--be);font-weight:700;}
  .delta-flat{color:var(--navy-soft);}
</style>

/* =========================================================
   LIVE SYNC \u2014 via the Claude "db" runtime capability, so this
   artifact stays in sync across every device/browser where
   Caroline opens the same published link (Chrome on desktop
   included), instead of the old per-device-only localStorage.
========================================================= */
const SYNC_DOC_PATH = "sync/state";
const PENDING_SYNC_KEY = "bosiango-cloud-pending";
let SYNC_ENABLED = false; // becomes true once the db capability connects
let dbNS = null;

let syncApplyingRemote = false; // guards against write-loop while applying a remote update
let cloudWriteChain = Promise.resolve();
let cloudWriteQueued = false;
// Marks typed while unsynced/offline are remembered individually, so when
// we reconnect and merge in what other teachers saved, OUR unsynced marks
// win for the boxes we touched and THEIR marks win everywhere else.
const PENDING_EDITS_KEY = "bosiango-pending-edits";
let pendingEdits = {};
let pendingSeq = 0;
try{
  pendingEdits = JSON.parse(localStorage.getItem(PENDING_EDITS_KEY) || "{}") || {};
  Object.values(pendingEdits).forEach(e => { if(e && e.v > pendingSeq) pendingSeq = e.v; });
}catch(e){ pendingEdits = {}; }
function savePendingEdits(){ try{ localStorage.setItem(PENDING_EDITS_KEY, JSON.stringify(pendingEdits)); }catch(e){} }
function recordPendingEdit(gradeName, asmId, stuId, subject, val){
  pendingSeq++;
  pendingEdits[[gradeName,asmId,stuId,subject].join("|")] = {g:gradeName, a:asmId, s:stuId, sub:subject, val:val, v:pendingSeq};
  savePendingEdits();
}
function reapplyPendingEdits(){
  Object.values(pendingEdits).forEach(e => {
    const g = state.grades[e.g]; if(!g) return;
    const asm = g.assessments.find(x => x.id === e.a); if(!asm) return;
    if(!asm.scores[e.s]) asm.scores[e.s] = {};
    if(e.val === null) delete asm.scores[e.s][e.sub]; else asm.scores[e.s][e.sub] = e.val;
  });
}
let cloudDirty = false; // true = local marks not yet confirmed saved to the shared copy
try{ cloudDirty = localStorage.getItem(PENDING_SYNC_KEY) === "1"; }catch(e){}
function markCloudDirty(){
  cloudDirty = true;
  try{ localStorage.setItem(PENDING_SYNC_KEY, "1"); }catch(e){}
}
function clearCloudDirty(){
  cloudDirty = false;
  try{ localStorage.removeItem(PENDING_SYNC_KEY); }catch(e){}
}

   CALCULATIONS
========================================================= */
function pointsForPct(pct){
  if(pct===null||pct===undefined||pct==="") return null;
  const p = Number(pct);
  if(Number.isNaN(p)) return null;
  const hit = GRADE_BANDS.find(b => p>=b.min && p<=b.max);
  return hit ? hit.points : (p>100?8:0);
}
function overallGrade(avgPoints){
  if(avgPoints===null||avgPoints===undefined||Number.isNaN(avgPoints)) return "-";
  if(avgPoints>=7) return "EE";
  if(avgPoints>=5) return "ME";
  if(avgPoints>=3) return "AE";
  if(avgPoints>0) return "BE";
  return "-";
}
function pointsToBand(pts){
  if(pts===null||pts===undefined) return "-";
  if(pts>=7) return "EE"; if(pts>=5) return "ME"; if(pts>=3) return "AE"; if(pts>=1) return "BE";
  return "-";
}
function firstName(full){
  const w = (full||"").split(" ")[0]||"";
  return w.charAt(0)+w.slice(1).toLowerCase();
}
function computeRows(students, assessment){
  if(!assessment) return [];
  const rows = students.map(stu => {
    const subjScores = assessment.scores[stu.id] || {};
    let totalPct=0, totalPoints=0, subjCount=0;
    const perSubject = SUBJECTS.map(subj => {
      const pct = subjScores[subj];
      const pts = pointsForPct(pct);
      if(pct!==undefined && pct!==null && pct!==""){ totalPct += Number(pct); totalPoints += pts||0; subjCount++; }
      return {subject:subj, pct: pct===undefined?null:pct, points: pts};
    });
    const avgPoints = subjCount>0 ? totalPoints/subjCount : null;
    return {studentId:stu.id, name:stu.name, photo:stu.photo, perSubject, totalMarks:totalPct, totalPoints, avgPoints, grade:overallGrade(avgPoints)};
  });
  const ranked = [...rows].sort((a,b) => (b.totalMarks||0)-(a.totalMarks||0));
  ranked.forEach((r,i) => r.position = i+1);
  const byId = {}; ranked.forEach(r => byId[r.studentId]=r);
  return students.map(s => byId[s.id]);
}
function classAverages(rows){
  const out = {};
  SUBJECTS.forEach(subj => {
    const vals = rows.map(r => (r.perSubject.find(p=>p.subject===subj)||{}).pct).filter(v=>v!==null&&v!==undefined&&v!=="");
    out[subj] = vals.length ? vals.reduce((a,b)=>a+Number(b),0)/vals.length : 0;
  });
  return out;
}
// Builds a synthetic "assessment" whose per-subject score for each student
// is the average of the same subject across two real assessments, then
// ranks it exactly like any other assessment (same totals/points/grade
// logic as computeRows) \u2014 so "average performance" gets its own position
// 1..last, not just an average of two separate totals.
function computeAveragedRows(students, asmA, asmB){
  const avgScores = {};
  students.forEach(stu => {
    avgScores[stu.id] = {};
    SUBJECTS.forEach(subj => {
      const a = asmA ? asmA.scores[stu.id]?.[subj] : undefined;
      const b = asmB ? asmB.scores[stu.id]?.[subj] : undefined;
      const aNum = (a!==undefined && a!==null && a!=="") ? Number(a) : null;
      const bNum = (b!==undefined && b!==null && b!=="") ? Number(b) : null;
      if(aNum!==null && bNum!==null) avgScores[stu.id][subj] = Math.round(((aNum+bNum)/2)*10)/10;
      else if(aNum!==null) avgScores[stu.id][subj] = aNum;
      else if(bNum!==null) avgScores[stu.id][subj] = bNum;
    });
  });
  const syntheticAsm = {
    id: "avg_synthetic", name: `Average of ${asmA?asmA.name:"?"} & ${asmB?asmB.name:"?"}`,
    term: (asmB&&asmB.term)||(asmA&&asmA.term), year: (asmB&&asmB.year)||(asmA&&asmA.year),
    grade: state.className, createdAt: Date.now(), scores: avgScores
  };
  return computeRows(students, syntheticAsm);
}

async function ensureDb(){
  if(dbNS) return dbNS;
  if(typeof firebase === "undefined") return null;
  try{
    // Never let a dead/absent connection block the app from opening \u2014
    // if we can't reach the sync backend within a few seconds, give up
    // for now and let the app run fully offline; the retry loop further
    // down will keep trying in the background.
    dbNS = await Promise.race([
      (async () => {
        if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
        return firebase.firestore();
      })(),
      new Promise((_, reject) => setTimeout(()=>reject(new Error("db-connect-timeout")), 4000))
    ]);
  }catch(e){ dbNS = null; }
  return dbNS;
}

// Saves a file to the viewer's device. Plain <a download> / blob links
// don't work inside a published Claude page, so every save in this app
// (PDF reports, JSON exports/backups) goes through this instead.
async function saveFile(filename, data){
  // On Claude's hosting, files must go through the downloads capability.
  // On independent hosting (GitHub Pages etc.), a normal browser download
  // link works fine and is used instead.
  if(typeof claude !== "undefined" && claude.use){
    const downloads = await ensureDownloads();
    if(downloads){
      try{
        await downloads.save({filename, data});
        return true;
      }catch(e){
        if(e && e.code === "declined") return false;
        showAlert("Couldn't save that file. Please try again.");
        return false;
      }
    }
  }
  try{
    const blob = data instanceof Blob ? data : new Blob([data], {type: filename.endsWith(".json") ? "application/json" : "application/octet-stream"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    return true;
  }catch(e){
    showAlert("Couldn't save that file. Please try again.");
    return false;
  }
}
// Renders a report element to a multi-page A4 PDF and saves it via the
// downloads capability (window.print()/Save-as-PDF isn't reliable inside
// a published, embedded page).
// Exports the report as a Word-compatible document (landscape, A4) so
// orientation is baked into the file itself \u2014 Word/printers respect it
// directly, sidestepping any print-dialog default that forces portrait.
// Exports the report as a genuine .docx (real OOXML/ZIP, built with
// JSZip) \u2014 the platform only allows saving .docx, not the classic
// HTML-as-.doc trick, so this walks the rendered report DOM into real
// Word XML and sets the section to landscape A4 directly in the file.
function escXml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&apos;");
}
function docxCellIsBold(cell){
  const style = cell.getAttribute("style")||"";
  return /font-weight:\s*(700|bold)/i.test(style) || !!cell.closest("thead") || cell.tagName==="TH";
}
function docxTableXml(table){
  const rows = Array.from(table.querySelectorAll("tr"));
  const pending = {};
  let totalCols = 0;
  rows.forEach(tr => {
    let sum = 0;
    Array.from(tr.children).forEach(cell => { sum += parseInt(cell.getAttribute("colspan")||"1", 10); });
    totalCols = Math.max(totalCols, sum);
  });

  // Without an explicit column grid, Word/LibreOffice auto-fits each
  // row's widths independently \u2014 which, combined with merged header
  // cells, makes rows drift out of alignment with each other. A fixed
  // <w:tblGrid> (mark-list tables get a wider NO/NAME pair, everything
  // else equal) keeps every row honestly lined up.
  const usableWidthTwips = 14000;
  const firstCellText = (rows[0] && rows[0].children[0] ? rows[0].children[0].textContent.trim().toUpperCase() : "");
  const isRosterStyle = firstCellText === "NO." && totalCols > 2;
  let colWidths;
  if(isRosterStyle){
    const noW = 500, nameW = 1800;
    const rest = totalCols - 2;
    const restW = Math.max(300, Math.floor((usableWidthTwips - noW - nameW) / rest));
    colWidths = [noW, nameW, ...Array(rest).fill(restW)];
  } else {
    const eachW = Math.floor(usableWidthTwips / totalCols);
    colWidths = Array(totalCols).fill(eachW);
  }

  let xml = `<w:tbl><w:tblPr><w:tblW w:w="${usableWidthTwips}" w:type="dxa"/><w:tblLayout w:type="fixed"/><w:tblBorders>`+
    ["top","left","bottom","right","insideH","insideV"].map(edge=>`<w:${edge} w:val="single" w:sz="4" w:space="0" w:color="C7CEDD"/>`).join("")+
    `</w:tblBorders></w:tblPr><w:tblGrid>${colWidths.map(w=>`<w:gridCol w:w="${w}"/>`).join("")}</w:tblGrid>`;

  rows.forEach(tr => {
    let col = 0;
    let rowXml = "<w:tr>";
    const cells = Array.from(tr.children);
    let cellIdx = 0;
    while(cellIdx < cells.length || (pending[col] && pending[col].remaining>0)){
      if(pending[col] && pending[col].remaining>0){
        const span = pending[col].span;
        const w = colWidths.slice(col, col+span).reduce((a,b)=>a+b, 0);
        rowXml += `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>`+(span>1?`<w:gridSpan w:val="${span}"/>`:"")+'<w:vMerge/><w:shd w:val="clear" w:fill="FFFFFF"/></w:tcPr><w:p/></w:tc>';
        pending[col].remaining -= 1;
        col += span;
        continue;
      }
      const cell = cells[cellIdx];
      if(!cell) break;
      cellIdx++;
      const span = parseInt(cell.getAttribute("colspan")||"1", 10);
      const rowspan = parseInt(cell.getAttribute("rowspan")||"1", 10);
      const bold = docxCellIsBold(cell);
      const text = escXml(cell.textContent.trim());
      const w = colWidths.slice(col, col+span).reduce((a,b)=>a+b, 0);
      const vMergeTag = rowspan>1 ? "<w:vMerge w:val=\"restart\"/>" : "";
      rowXml += `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>`+(span>1?`<w:gridSpan w:val="${span}"/>`:"")+vMergeTag+'<w:shd w:val="clear" w:fill="FFFFFF"/></w:tcPr>'+
        `<w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r>${bold?"<w:rPr><w:b/></w:rPr>":""}<w:t xml:space="preserve">${text}</w:t></w:r></w:p></w:tc>`;
      if(rowspan>1) pending[col] = {remaining: rowspan-1, span};
      col += span;
    }
    xml += rowXml + "</w:tr>";
  });
  xml += "</w:tbl>";
  return xml;
}
function docxParagraphXml(el){
  const text = el.textContent.trim();
  if(!text) return "";
  const tag = el.tagName;
  const isHeading = tag==="H1"||tag==="H2"||tag==="H3";
  const size = tag==="H1" ? 32 : tag==="H2" ? 24 : tag==="H3" ? 20 : 18;
  return `<w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r><w:rPr>${isHeading?"<w:b/>":""}<w:sz w:val="${size}"/></w:rPr><w:t xml:space="preserve">${escXml(text)}</w:t></w:r></w:p>`;
}
function docxWalkBlock(el, xmlParts){
  if(el.tagName === "TABLE"){
    xmlParts.push(docxTableXml(el));
    xmlParts.push("<w:p/>");
  } else if(el.tagName === "IMG"){
    // logo images are skipped for simplicity
  } else if(el.children && el.children.length && el.querySelector && el.querySelector("table")){
    Array.from(el.children).forEach(child => docxWalkBlock(child, xmlParts));
  } else {
    const p = docxParagraphXml(el);
    if(p) xmlParts.push(p);
  }
}
async function ensureJSZip(){

async function downloadReportPDF(filenameBase, btnEl){
  const node = document.getElementById("printable");
  if(!node){ showAlert("Nothing to export."); return; }
  const originalHTML = btnEl ? btnEl.innerHTML : null;
  if(btnEl){ btnEl.disabled = true; btnEl.innerHTML = "Preparing PDF\u2026"; }

  // Temporarily unclip anything horizontally scrollable (wide mark-list
  // tables) so html2canvas captures the FULL content width instead of
  // just what's visible on a narrow phone screen.
  const restoreFns = [];
  function unclip(el){
    if(!el || !el.style) return;
    const cs = getComputedStyle(el);
    if(cs.overflowX === "auto" || cs.overflowX === "scroll"){
      const prevOverflow = el.style.overflow, prevOverflowX = el.style.overflowX;
      el.style.overflow = "visible";
      el.style.overflowX = "visible";
      restoreFns.push(()=>{ el.style.overflow = prevOverflow; el.style.overflowX = prevOverflowX; });
    }
    Array.from(el.children).forEach(unclip);
  }
  const prevWidth = node.style.width, prevMaxWidth = node.style.maxWidth;
  unclip(node);
  const fullWidth = Math.max(node.scrollWidth, node.getBoundingClientRect().width);
  node.style.width = fullWidth + "px";
  node.style.maxWidth = "none";
  restoreFns.push(()=>{ node.style.width = prevWidth; node.style.maxWidth = prevMaxWidth; });

  let tempWrapper = null;
  try{
    if(typeof html2canvas === "undefined" || !window.jspdf){
      showAlert("PDF tools are still loading \u2014 please wait a few seconds and try again.");
      return;
    }
    const { jsPDF } = window.jspdf;
    let pdf = null;

    const captureEl = async (el) => html2canvas(el, {
      scale:2,
      backgroundColor:"#ffffff",
      useCORS:true,
      windowWidth: fullWidth,
      // Skip the Download/Close button row itself \u2014 it shouldn't appear
      // inside the PDF it produces.
      ignoreElements: e => e.classList && e.classList.contains("no-print")
    });

    const addCanvasAsPage = (canvas, fitOnePage) => {
      const landscape = canvas.width > canvas.height;
      const pageW = landscape ? 841.89 : 595.28;
      const pageH = landscape ? 595.28 : 841.89;
      const imgW = pageW;
      const imgH = (canvas.height * imgW) / canvas.width;
      const imgData = canvas.toDataURL("image/jpeg", 0.92);
      if(!pdf) pdf = new jsPDF({orientation: landscape?"landscape":"portrait", unit:"pt", format:"a4"});
      else pdf.addPage("a4", landscape?"landscape":"portrait");
      if(fitOnePage){
        // Learner reports must stay on ONE page: shrink slightly if needed
        // instead of letting the bottom spill onto a second page.
        const margin = 14;
        let drawW = imgW, drawH = imgH, x = 0, y = 0;
        if(imgH > pageH - margin*2){
          const s = (pageH - margin*2) / imgH;
          drawW = imgW * s; drawH = imgH * s;
          x = (pageW - drawW) / 2; y = margin;
        }
        pdf.addImage(imgData, "JPEG", x, y, drawW, drawH);
        return;
      }
      let heightLeft = imgH, position = 0;
      pdf.addImage(imgData, "JPEG", 0, position, imgW, imgH);
      heightLeft -= pageH;
      while(heightLeft > 0){
        position = heightLeft - imgH;
        pdf.addPage("a4", landscape?"landscape":"portrait");
        pdf.addImage(imgData, "JPEG", 0, position, imgW, imgH);
        heightLeft -= pageH;
      }
    };

    // A report can mark a section boundary with class "print-page-break"
    // (e.g. the Subject Analysis block) \u2014 when present, everything up to
    // and including it becomes its own PDF page, and everything after it
    // becomes a second page, instead of one continuous image sliced at
    // an arbitrary height.
    const breakEl = node.querySelector(".print-page-break");
    if(breakEl){
      addCanvasAsPage(await captureEl(breakEl));

      tempWrapper = document.createElement("div");
      tempWrapper.style.cssText = `position:fixed;left:-99999px;top:0;background:#fff;width:${fullWidth}px;`;
      let sib = breakEl.nextElementSibling;
      while(sib){
        if(!(sib.classList && sib.classList.contains("no-print"))){
          tempWrapper.appendChild(sib.cloneNode(true));
        }
        sib = sib.nextElementSibling;
      }
      document.body.appendChild(tempWrapper);
      addCanvasAsPage(await captureEl(tempWrapper));
    } else {
      addCanvasAsPage(await captureEl(node), !node.classList.contains("wide"));
    }

    const blob = pdf.output("blob");
    await saveFile(`${filenameBase}.pdf`, blob);
  }catch(e){
    showAlert("Couldn't create the PDF. Please try again.");
  } finally {
    if(tempWrapper && tempWrapper.parentNode) tempWrapper.parentNode.removeChild(tempWrapper);
    restoreFns.reverse().forEach(fn=>fn());
    if(btnEl){ btnEl.disabled = false; btnEl.innerHTML = originalHTML; }
  }
}
function queueCloudPush(){
  if(syncApplyingRemote) return;
  markCloudDirty();
  if(!canPushCloud()){
    // Offline or not yet connected: the edit is already safe in
    // localStorage (scheduleSave handles that separately). Flag it as
    // pending so a reconnect (online event / retry loop) pushes it up.
    setSyncStatus(navigator.onLine === false ? "pending" : (SYNC_ENABLED ? "error" : "offline"));
    return;
  }
  cloudWriteQueued = true;
  cloudWriteChain = cloudWriteChain.then(async () => {
    if(!cloudWriteQueued) return;
    cloudWriteQueued = false;
    try{
      const sentSeq = pendingSeq;
      await withTimeout(dbNS.doc(SYNC_DOC_PATH).set(buildCloudPayload()), 10000, "sync-set");
      Object.keys(pendingEdits).forEach(k => { if(pendingEdits[k] && pendingEdits[k].v <= sentSeq) delete pendingEdits[k]; });
      savePendingEdits();
      clearCloudDirty();
      setSyncStatus("connected");
    }catch(e){
      // Write failed (likely a dropped connection mid-write). Keep the
      // dirty flag set so the retry loop below tries again shortly.
      setSyncStatus(navigator.onLine === false ? "pending" : "error");
    }
  });
}
// Retries connecting and/or flushing any offline edits once we're back
// online \u2014 fired on the browser's 'online' event, on tab focus, and on
// a slow background timer as a fallback for flaky mobile connections.
let reconnecting = false;
async function attemptReconnectAndFlush(){
  if(reconnecting || syncApplyingRemote) return;
  reconnecting = true;
  try{
    if(!syncPulled){
      const db = await ensureDb();
      if(db){
        SYNC_ENABLED = true;
        try{
          const ref = db.doc(SYNC_DOC_PATH);
          const snap = await withTimeout(ref.get(), 6000, "sync-get");
          // Pull + merge first so we don't clobber marks another
          // device/teacher saved while this one was offline.
          if(snap.exists) applyCloudSnapshot(snap.data());
          attachSyncListener();
          syncPulled = true;
          setSyncStatus("connected");
        }catch(e){
          setSyncStatus(navigator.onLine === false ? "pending" : "error");
        }
      }
    }
    if(syncPulled && cloudDirty){
      queueCloudPush();
    }
  } finally {
    reconnecting = false;
  }
}
if(typeof window !== "undefined"){
  window.addEventListener("online", attemptReconnectAndFlush);
  window.addEventListener("offline", () => setSyncStatus("pending"));
  document.addEventListener("visibilitychange", () => {
    if(document.visibilityState === "visible") attemptReconnectAndFlush();
  });
  setInterval(attemptReconnectAndFlush, 25000);
}

function cloudStudentsMap(students){
  const map = {};
  students.forEach(s => { map[s.id] = {name: s.name}; });
  return map;
}
function cloudAssessmentsMap(assessments){
  const map = {};
  assessments.forEach(a => { map[a.id] = {name:a.name, term:a.term, year:a.year, grade:a.grade, createdAt:a.createdAt, scores:a.scores}; });
  return map;
}
function buildCloudPayload(){
  saveActiveGradeToStore();
  const gradesPayload = {};
  Object.entries(state.grades).forEach(([gName, gData]) => {
    gradesPayload[gName] = {
      className: gData.className,
      classTeacher: gData.classTeacher || "",
      students: cloudStudentsMap(gData.students),
      assessments: cloudAssessmentsMap(gData.assessments),
      subjectTeachers: gData.subjectTeachers,
      deletedStudentIds: [],
      deletedAssessmentIds: []
    };
  });
  return { grades: gradesPayload, updatedAt: Date.now() };
}
function mergeScores(localScores, cloudScores){
  const out = Object.assign({}, localScores||{});
  Object.entries(cloudScores||{}).forEach(([sid, subj]) => {
    out[sid] = Object.assign({}, out[sid]||{}, subj);
  });
  return out;
}
// Merges one grade's cloud data into its local slice in state.grades.
function applyCloudGradeSlice(gName, gData){
  if(!state.grades[gName]) state.grades[gName] = blankGradeData(gName);
  const target = state.grades[gName];
  if(gData.className) target.className = gData.className;
  if(gData.classTeacher!==undefined && gData.classTeacher!==null) target.classTeacher = gData.classTeacher;

  const cloudStudents = gData.students || {};
  const localById = {};
  target.students.forEach(s => localById[s.id]=s);
  Object.entries(cloudStudents).forEach(([id, cs]) => {
    if(localById[id]) localById[id].name = cs.name;
    else target.students.push({id, name:cs.name, photo:null});
  });

  const cloudAsm = gData.assessments || {};
  const localAsmById = {};
  target.assessments.forEach(a => localAsmById[a.id]=a);
  Object.entries(cloudAsm).forEach(([id, ca]) => {
    if(localAsmById[id]){
      const t = localAsmById[id];
      t.name=ca.name; t.term=ca.term; t.year=ca.year;
      t.scores = mergeScores(t.scores, ca.scores);
    } else {
      target.assessments.push({id, name:ca.name, term:ca.term, year:ca.year, grade:ca.grade||target.className, createdAt:ca.createdAt||Date.now(), scores:ca.scores||{}});
    }
  });

  if(gData.subjectTeachers) target.subjectTeachers = Object.assign({}, target.subjectTeachers, gData.subjectTeachers);

  // Apply permanent deletions (tombstones) so a delete sticks everywhere
  // and a student/assessment that was removed doesn't get resurrected
  // by a stale cloud copy.
  const delStudents = gData.deletedStudentIds || [];
  if(delStudents.length){
    target.students = target.students.filter(s => !delStudents.includes(s.id));
    target.assessments.forEach(a => { delStudents.forEach(id => { delete a.scores[id]; }); });
  }
  const delAsm = gData.deletedAssessmentIds || [];
  if(delAsm.length){
    target.assessments = target.assessments.filter(a => !delAsm.includes(a.id));
  }
}
function applyCloudSnapshot(data){
  syncApplyingRemote = true;
  try{
    const cloudGrades = data.grades || {};
    Object.entries(cloudGrades).forEach(([gName, gData]) => applyCloudGradeSlice(gName, gData));
    reapplyPendingEdits();

    // Refresh the active working view from the just-updated store, then
    // run the safety nets against it, then persist back.
    syncActiveGradeFromStore();
    if(ui.selectedAssessmentId && !state.assessments.find(a=>a.id===ui.selectedAssessmentId)){
      ui.selectedAssessmentId = state.assessments.length ? state.assessments[state.assessments.length-1].id : null;
    }

    runDedupeSafetyNets();
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
    render();
  } finally {
    syncApplyingRemote = false;
  }
}
// Cleans up same-name duplicate students and same-name/term/year duplicate
// assessments in the CURRENTLY ACTIVE grade, and \u2014 critically \u2014 tells the
// cloud to remove them too, so the cleanup sticks everywhere instead of
// just healing locally each time a snapshot arrives.
function runDedupeSafetyNets(){
  const studentDedupe = dedupeStudentsByName();
  const mergeResult = mergeDuplicateAssessments();
  saveActiveGradeToStore();
  if(studentDedupe.changed || mergeResult.changed){
    try{ queueCloudPush(); }catch(e){}
  }
  return studentDedupe.changed || mergeResult.changed;
}
function syncPushField(_fieldPathArray, _value){
  // Kept for call-site compatibility \u2014 every local mutation now pushes
  // a full, current snapshot rather than a per-field patch.
  if(syncApplyingRemote) return;
  queueCloudPush();
}
function attachSyncListener(){
  if(!dbNS) return;
  try{
    dbUnsub = dbNS.doc(SYNC_DOC_PATH).onSnapshot(
      snap => { if(snap.exists && !snap.metadata.hasPendingWrites) applyCloudSnapshot(snap.data()); },
      () => setSyncStatus("error")
    );
  }catch(e){}
}
// Safety net: if two students ever end up with the same name (e.g. from
// an old duplicate-seed bug), merge them into one instead of showing both.
function dedupeStudentsByName(){
  const groups = {};
  state.students.forEach(s => {
    const key = (s.name||"").trim().toUpperCase();
    if(!groups[key]) groups[key] = [];
    groups[key].push(s);
  });
  let changed = false;
  const removedIds = [];
  const keptIds = [];
  Object.values(groups).forEach(group => {
    if(group.length < 2) return;
    changed = true;
    const keep = group[0];
    keptIds.push(keep.id);
    group.slice(1).forEach(dupe => {
      state.assessments.forEach(a => {
        if(a.scores[dupe.id]){
          a.scores[keep.id] = Object.assign({}, a.scores[dupe.id], a.scores[keep.id]);
          delete a.scores[dupe.id];
        }
      });
      if(!keep.photo && dupe.photo) keep.photo = dupe.photo;
    });
    const dupeIds = group.slice(1).map(d=>d.id);
    removedIds.push(...dupeIds);
    state.students = state.students.filter(s => !dupeIds.includes(s.id));
  });
  return { changed, removedIds, keptIds };
}
// Safety net: if two assessments end up with the same term + year + name
// (e.g. two teachers each created "Mid Term 3" separately instead of using
// the one that already existed), merge their scores into one instead of
// splitting the class's marks across several hidden copies.
function mergeDuplicateAssessments(){
  const groups = {};
  state.assessments.forEach(a => {
    const key = (a.term||"") + "||" + (a.year||"") + "||" + (a.name||"").trim().toUpperCase();
    if(!groups[key]) groups[key] = [];
    groups[key].push(a);
  });
  let changed = false;
  const removedIds = [];
  const keptIds = [];
  Object.values(groups).forEach(group => {
    if(group.length < 2) return;
    changed = true;
    group.sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
    const keep = group[0];
    keptIds.push(keep.id);
    group.slice(1).forEach(dupe => {
      Object.entries(dupe.scores||{}).forEach(([sid, subjScores]) => {
        keep.scores[sid] = Object.assign({}, subjScores, keep.scores[sid]||{});
      });
    });
    const dupeIds = group.slice(1).map(d=>d.id);
    removedIds.push(...dupeIds);
    state.assessments = state.assessments.filter(a => !dupeIds.includes(a.id));
    if(dupeIds.includes(ui.selectedAssessmentId)) ui.selectedAssessmentId = keep.id;
  });
  return { changed, removedIds, keptIds };
}
// Used only when this device has NO saved data yet \u2014 checks the cloud
// FIRST, before ever generating a fresh starter roster, so a brand-new
// device can never create duplicate students alongside the real ones.
// Only bootstraps the currently-active grade; other grades load lazily
// the first time someone switches to them (via the live listener, which
// already carries every grade's data once connected).
// Races any promise against a timeout so a stalled connection can never
// block the app from opening \u2014 used around every network call in the
// sync layer below.
function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(()=>reject(new Error((label||"operation")+"-timeout")), ms))
  ]);
}
async function bootstrapFromCloudOrSeed(){
  setSyncStatus("connecting");
  const db = await ensureDb();
  if(db){
    SYNC_ENABLED = true;
    try{
      const ref = db.doc(SYNC_DOC_PATH);
      const snap = await withTimeout(ref.get(), 6000, "sync-get");
      const cloudGradeData = (snap.exists && snap.data() && snap.data().grades) ? snap.data().grades[state.currentGrade] : null;
      if(cloudGradeData && Object.keys(cloudGradeData.students||{}).length){
        state.grades[state.currentGrade] = blankGradeData(state.currentGrade);
        applyCloudSnapshot(snap.data());
      } else {
        const def = defaultGradeData(state.currentGrade);
        state.grades[state.currentGrade] = def;
        syncActiveGradeFromStore();
        await withTimeout(ref.set(buildCloudPayload()), 6000, "sync-set");
        clearCloudDirty();
      }
      attachSyncListener();
      syncPulled = true;
      setSyncStatus("connected");
    }catch(e){
      setSyncStatus("error");
      state.grades[state.currentGrade] = defaultGradeData(state.currentGrade);
      syncActiveGradeFromStore();
    }
  } else {
    SYNC_ENABLED = false;
    setSyncStatus("offline");
    state.grades[state.currentGrade] = defaultGradeData(state.currentGrade);
    syncActiveGradeFromStore();
  }
}
// Used when this device already has saved data \u2014 connects to the cloud
// and reconciles, without ever discarding what's already here.
async function initSync(){
  setSyncStatus("connecting");
  const db = await ensureDb();
  if(!db){ SYNC_ENABLED = false; setSyncStatus("offline"); return; }
  SYNC_ENABLED = true;
  try{
    const ref = db.doc(SYNC_DOC_PATH);
    const snap = await withTimeout(ref.get(), 6000, "sync-get");
    if(!snap.exists){ await withTimeout(ref.set(buildCloudPayload()), 6000, "sync-set"); clearCloudDirty(); }
    else applyCloudSnapshot(snap.data());
    attachSyncListener();
    syncPulled = true;
    setSyncStatus("connected");
    if(cloudDirty) queueCloudPush();
  }catch(e){
    setSyncStatus("error");
  }
}

// One-time migration: backfills learner names for any grade that has
// ROSTER data on file but currently has an empty roster in the app
// (e.g. a grade that was visited before names were supplied). Never
// touches a grade that already has students \u2014 existing entries always
// win. Pushes the addition to the cloud too, so it reaches every device.
function backfillMissingRosters(){
  let changed = false;
  Object.keys(ROSTERS).forEach(grade => {
    if(!state.grades[grade]){
      state.grades[grade] = defaultGradeData(grade);
      changed = true;
    } else if(!state.grades[grade].students || state.grades[grade].students.length === 0){
      state.grades[grade].students = buildRosterStudents(grade);
      changed = true;
    }
  });
  if(changed){
    syncActiveGradeFromStore();
    saveActiveGradeToStore();
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
    try{ queueCloudPush(); }catch(e){}
  }
  return changed;
}

function updateScore(assessmentId, studentId, subject, value){
  const a = state.assessments.find(a=>a.id===assessmentId);

    scheduleSave();
    if(!refreshEntrySummary()) render();
    try{ queueCloudPush(); }catch(e){}
  } else {

    scheduleSave();
    if(!refreshEntrySummary()) render();
    syncPushField(["assessments", assessmentId, "scores", studentId, subject], finalVal);
  }
}
function parseCSV(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim()!=="");
  if(!lines.length) return null;
  const header = lines[0].split(",").map(h=>h.trim().toUpperCase());
  const nameIdx = header.findIndex(h=>h.includes("NAME"));
  if(nameIdx===-1) return null;
  const subjIdxMap = {};
  SUBJECTS.forEach(subj => {
    const idx = header.findIndex(h => h===subj || h.replace(/\s+/g,"")===subj.replace(/\s+/g,""));
    if(idx!==-1) subjIdxMap[subj]=idx;
  });
  const dataRows = [];
  for(let i=1;i<lines.length;i++){
    const cells = lines[i].split(",").map(c=>c.trim());
    const name = cells[nameIdx];
    if(!name) continue;
    const rowScores = {};
    Object.entries(subjIdxMap).forEach(([subj,idx]) => {
      const raw = cells[idx];
      if(raw!==undefined && raw!==""){ const num=Number(raw); if(!Number.isNaN(num)) rowScores[subj]=num; }
    });
    dataRows.push({name:name.toUpperCase(), scores:rowScores});
  }
  return dataRows;
}
function handleCSVUpload(file){
  const reader = new FileReader();
  reader.onload = () => {
    const parsed = parseCSV(String(reader.result));
    if(!parsed || !parsed.length){
      showAlert("Couldn't read that file. Upload a CSV with a NAME column and subject columns matching: "+SUBJECTS.join(", "));
      return;
    }
    showAssessmentDetails("Term 1", file.name.replace(/\.csv$/i,""), ({term,year,name}) => {
      if(!name || !name.trim()) return;
      const idByName = {};
      state.students.forEach(s => idByName[s.name.toUpperCase()]=s.id);
      const newScores = {};
      parsed.forEach(row => {
        let sid = idByName[row.name];
        if(!sid){
          const newStu = {id:uid("stu"), name:row.name, photo:null};
          state.students.push(newStu);
          idByName[row.name]=newStu.id;
          sid = newStu.id;
          syncPushField(["students", newStu.id], {name: newStu.name});
        }
        newScores[sid]=row.scores;
      });

      const existing = state.assessments.find(a =>
        a.term===term && a.year===year && (a.name||"").trim().toUpperCase()===name.trim().toUpperCase()
      );
      if(existing){
        Object.entries(newScores).forEach(([sid, subjScores]) => {
          existing.scores[sid] = Object.assign({}, subjScores, existing.scores[sid]||{});
        });
        ui.selectedAssessmentId = existing.id;
        ui.activeTab = "assessment";
        persistAndRender();
        syncPushField(["assessments", existing.id, "scores"], existing.scores);
        showAlert(`"${name.trim()}" already existed \u2014 merged this CSV's marks into it instead of creating a duplicate.`);
        return;
      }

      const newAsm = {id:uid("asm"), name:name.trim(), term, year, grade:state.className, createdAt:Date.now(), scores:newScores};
      state.assessments.push(newAsm);
      ui.selectedAssessmentId = newAsm.id;
      ui.activeTab = "assessment";
      persistAndRender();
      syncPushField(["assessments", newAsm.id], {name:newAsm.name, term, year, grade:newAsm.grade, createdAt:newAsm.createdAt, scores:newScores});
    });
  };
  reader.readAsText(file);
}

// Shared merge logic used by both the single-grade Import and the
// all-grades backup restore below \u2014 merges into state.grades[gName]
// directly (matching students by name), never deletes anything.
function mergeGradeSlice(gName, incoming){
  if(!state.grades[gName]) state.grades[gName] = blankGradeData(gName);
  const target = state.grades[gName];
  const idByName = {};
  target.students.forEach(s => idByName[s.name.toUpperCase()]=s.id);

  (incoming.students||[]).forEach(s => {
    const key = (s.name||"").toUpperCase();
    if(key && !idByName[key]){
      const newStu = {id:uid("stu"), name:s.name, photo:null};
      target.students.push(newStu);
      idByName[key]=newStu.id;
      target.assessments.forEach(a => { if(!a.scores[newStu.id]) a.scores[newStu.id]={}; });
    }
  });

  let mergedCount = 0, addedCount = 0;
  (incoming.assessments||[]).forEach(inc => {
    let t = target.assessments.find(a => a.term===inc.term && a.year===inc.year && a.name===inc.name);
    if(!t){
      t = {id:uid("asm"), name:inc.name, term:inc.term, year:inc.year, grade:target.className||gName, createdAt:Date.now(), scores:{}};
      target.assessments.push(t);
      addedCount++;
    }
    Object.entries(inc.scoresByName||{}).forEach(([name, subjScores]) => {
      const sid = idByName[(name||"").toUpperCase()];
      if(!sid) return;
      if(!t.scores[sid]) t.scores[sid]={};
      Object.entries(subjScores||{}).forEach(([subj,val]) => {
        const existing = t.scores[sid][subj];
        const isEmpty = existing===undefined || existing===null || existing==="";
        if(isEmpty && val!==undefined && val!==null && val!==""){
          t.scores[sid][subj]=val;
          mergedCount++;
        }
      });
    });
  });

  if(incoming.subjectTeachers){
    target.subjectTeachers = target.subjectTeachers || {};
    Object.entries(incoming.subjectTeachers).forEach(([subj,name]) => {
      if(name && !target.subjectTeachers[subj]) target.subjectTeachers[subj] = name;
    });
  }
  return {mergedCount, addedCount};
}

function importData(file){
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try{ data = JSON.parse(String(reader.result)); }
    catch(e){ showAlert("Couldn't read that file \u2014 it doesn't look like a valid export."); return; }

    // Full "Export All Grades" backup file \u2014 restore every grade in it.
    if(data && data.allGrades && data.grades && typeof data.grades === "object"){
      const gradeNames = Object.keys(data.grades);
      if(!gradeNames.length){ showAlert("That backup file doesn't contain any grades."); return; }
      showConfirm(`This is a full backup covering ${gradeNames.length} grade(s). Restore it into the app? This won't delete anything \u2014 it only fills in and adds scores.`, () => {
        let totalMerged = 0, totalAdded = 0;
        gradeNames.forEach(gName => {
          const r = mergeGradeSlice(gName, data.grades[gName]);
          totalMerged += r.mergedCount; totalAdded += r.addedCount;
        });
        syncActiveGradeFromStore();
        if(ui.selectedAssessmentId && !state.assessments.find(a=>a.id===ui.selectedAssessmentId)){
          ui.selectedAssessmentId = state.assessments.length ? state.assessments[state.assessments.length-1].id : null;
        }
        persistAndRender();
        try{ queueCloudPush(); }catch(e){}
        showAlert(`Backup restored: merged ${totalMerged} score(s) across ${gradeNames.length} grade(s)${totalAdded?`, added ${totalAdded} new assessment(s)`:""}.`);
      });
      return;
    }

    if(!data || !Array.isArray(data.assessments)){ showAlert("That file doesn't look like a BOSIANGO 2026 Assessment export."); return; }

    showConfirm(`Merge marks from this file into your current data? This won't delete anything \u2014 it only fills in and adds scores.`, () => {
      const idByName = {};
      state.students.forEach(s => idByName[s.name.toUpperCase()]=s.id);

      (data.students||[]).forEach(s => {
        const key = (s.name||"").toUpperCase();
        if(key && !idByName[key]){
          const newStu = {id:uid("stu"), name:s.name, photo:null};
          state.students.push(newStu);
          idByName[key]=newStu.id;
          state.assessments.forEach(a => { if(!a.scores[newStu.id]) a.scores[newStu.id]={}; });
        }
      });

      let mergedCount = 0, addedCount = 0;
      data.assessments.forEach(incoming => {
        let target = state.assessments.find(a =>
          a.term===incoming.term && a.year===incoming.year && a.name===incoming.name
        );
        if(!target){
          target = {id:uid("asm"), name:incoming.name, term:incoming.term, year:incoming.year, grade:state.className, createdAt:Date.now(), scores:{}};
          state.assessments.push(target);
          addedCount++;
        }
        Object.entries(incoming.scoresByName||{}).forEach(([name, subjScores]) => {
          const sid = idByName[(name||"").toUpperCase()];
          if(!sid) return;
          if(!target.scores[sid]) target.scores[sid]={};
          Object.entries(subjScores||{}).forEach(([subj,val]) => {
            const existing = target.scores[sid][subj];
            const isEmpty = existing===undefined || existing===null || existing==="";
            if(isEmpty && val!==undefined && val!==null && val!==""){
              target.scores[sid][subj] = val;
              mergedCount++;
            }
          });
        });
      });

      if(data.subjectTeachers){
        Object.entries(data.subjectTeachers).forEach(([subj,name]) => {
          if(name && !state.subjectTeachers[subj]) state.subjectTeachers[subj] = name;
        });
      }

      persistAndRender();
      try{ queueCloudPush(); }catch(e){}
      showAlert(`Merged ${mergedCount} scores${addedCount?` and added ${addedCount} new assessment(s)`:""}.`);
    });
  };
  reader.readAsText(file);
}

function barChart(data, labelKey, valKey, maxVal, fmt){
  maxVal = maxVal || Math.max(1, ...data.map(d=>d[valKey]||0));
  fmt = fmt || (v=>v);
  return '<div class="barchart">' + data.map(d => {
    const h = Math.max(2, ((d[valKey]||0)/maxVal)*100);
    return `<div class="bar-col">
      <div class="bar-val">${fmt(d[valKey])}</div>
      <div class="bar" style="height:${h}%"></div>
      <div class="bar-label">${esc(d[labelKey])}</div>
    </div>`;
  }).join("") + '</div>';
}

/* =========================================================
   TAB: ENTER MARKS
========================================================= */
function renderEntry(){
  const asm = state.assessments.find(a=>a.id===ui.selectedAssessmentId);
  const asmOptions = state.assessments.map(a=>`<option value="${a.id}" ${a.id===ui.selectedAssessmentId?"selected":""}>${esc(a.name)}</option>`).join("");
  const subjOptions = SUBJECTS.map(s=>`<option value="${s}" ${s===ui.mySubject?"selected":""}>${s}</option>`).join("");

  let body;
  if(!asm){
    body = `<div class="empty"><p>No assessments yet.</p><button class="btn" onclick="addAssessment()">${icon("plus",16)} Create an assessment</button></div>`;
  }else{
    let filled=0, sum=0, count=0;
    const rows = state.students.map((stu, idx) => {
      const val = (asm.scores[stu.id]||{})[ui.mySubject];
      if(val!==undefined && val!==null && val!==""){ filled++; sum+=Number(val); count++; }
      return `<tr>
        <td><div style="display:flex;align-items:center;gap:8px;">${avatarHTML(stu.photo, stu.name, 22)}<span>${esc(stu.name)}</span></div></td>
        <td style="text-align:right;">
          <input type="number" inputmode="numeric" min="0" max="100" enterkeyhint="next" data-entry-idx="${idx}" style="width:70px;text-align:right;" value="${val===undefined||val===null?"":val}"
            onchange="updateScore('${asm.id}','${stu.id}','${ui.mySubject.replace(/'/g,"\\'")}', this.value)"
            onkeydown="if(event.key==='Enter'){event.preventDefault(); this.blur(); focusNextEntryInput(${idx});}">
        </td>
      </tr>`;
    }).join("");
    const avg = count ? (sum/count).toFixed(1) : null;
    body = `
      <p class="small-note" id="entrySummaryLine">${filled} of ${state.students.length} entered${avg!==null ? " \u00b7 class average "+avg+"%" : ""}</p>
      <table><thead><tr><th>Student</th><th style="text-align:right;">${esc(ui.mySubject)} (%)</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  return `
    <div class="row" style="align-items:flex-end;margin-bottom:20px;">
      <div><label class="field-label">Assessment</label><select onchange="ui.selectedAssessmentId=this.value; render();">${asmOptions}</select></div>
      <div><label class="field-label">I'm entering marks for</label><select onchange="ui.mySubject=this.value; render();">${subjOptions}</select></div>
      <div><label class="field-label">Teacher name</label>
        <input type="text" value="${esc(state.subjectTeachers[ui.mySubject]||"")}" placeholder="Your name"
          onchange="setSubjectTeacher('${ui.mySubject.replace(/'/g,"\\'")}', this.value);"></div>
    </div>
    ${body}`;
}

/* =========================================================
   TAB: ASSESSMENT
========================================================= */
function renderAssessment(){

  const header = `
    <div class="between">
      <div class="row">
        <select onchange="ui.selectedAssessmentId=this.value; render();">${asmOptions}</select>

      </div>
      <div class="row">
        <button class="btn outline sm" onclick="openClassReport()">${icon("download",14)} Download Class Report</button>

        <button class="btn outline sm" onclick="document.getElementById('csvInput').click()">${icon("upload",14)} Upload CSV</button>
        <button class="btn sm" onclick="addAssessment()">${icon("plus",14)} New assessment</button>
      </div>
    </div>`;

  if(!asm){
    return header + `<div class="empty"><p>No assessments yet.</p><button class="btn" onclick="addAssessment()">${icon("plus",16)} Create an assessment</button></div>`;
  }

  const rows = computeRows(state.students, asm);
  const sortedRows = [...rows].sort((a,b)=>a.position-b.position);
  const rankData = sortedRows.map(r=>({name:r.name.split(" ")[0], marks:r.totalMarks}));
  const subjAvgs = classAverages(rows);
  const subjData = SUBJECTS.map(s=>({subject:s.replace(" & ","&").slice(0,8), avg:Number(subjAvgs[s].toFixed(1))}));

  const tableRows = sortedRows.map((r,idx) => {
    const expanded = ui.expandedStudent===r.studentId;

        return `<div class="subj-field">
          <label>${subj}</label>
          <input type="number" min="0" max="100" value="${cur.pct===null?"":cur.pct}"
            onclick="event.stopPropagation()"
            onchange="event.stopPropagation();updateScore('${asm.id}','${r.studentId}','${subj.replace(/'/g,"\\'")}', this.value)">
          ${cur.points!==null?`<span style="font-size:10px;color:var(--navy-soft);"> (${cur.points} pts)</span>`:""}
        </div>`;
      }).join("");
      expandHTML = `<tr class="expand-panel"><td colspan="6" style="padding:12px;">
        <div class="subj-grid">${fields}</div>
        <div style="margin-top:10px;">
          <button class="btn sm outline" onclick="event.stopPropagation();openReport('${r.studentId}')">${icon("download",14)} Download report</button>
        </div>
      </td></tr>`;
    }
    return `<tr class="${idx%2?'zebra':''}" style="cursor:pointer;" onclick="ui.expandedStudent = ui.expandedStudent==='${r.studentId}'?null:'${r.studentId}'; render();">
        <td>${positionBadge(r.position, rows.length)}</td>
        <td style="border-left:2px solid var(--navy);"><div style="display:flex;align-items:center;gap:8px;">${avatarHTML(r.photo, r.name, 24)}<span style="font-weight:600;">${esc(r.name)}</span></div></td>
        <td style="text-align:right;font-weight:600;border-left:2px solid var(--navy);">${r.totalMarks||0}</td>
        <td style="text-align:right;font-weight:600;border-left:2px solid var(--navy);">${r.totalPoints||0}/${SUBJECTS.length*8}</td>
        <td style="text-align:right;color:var(--navy-soft);border-left:1px solid var(--navy-line);">${r.avgPoints!==null?r.avgPoints.toFixed(2):"\u2014"}</td>
        <td style="text-align:center;border-left:2px solid var(--navy);">${gradePill(r.grade)}</td>
        <td style="text-align:center;">${expanded?icon("chevronDown",14):icon("chevronRight",14)}</td>

  return header + `
    <div style="display:grid;grid-template-columns:1fr;gap:14px;margin:20px 0;" class="two-col">
      <div class="chart-card"><h3>Class ranking \u2014 total marks</h3>${barChart(rankData,"name","marks")}</div>
      <div class="chart-card"><h3>Class average by subject (%)</h3>${barChart(subjData,"subject","avg",100, v=>v+"%")}</div>
    </div>
    <div style="border:1px solid var(--navy-line);border-radius:2px;overflow-x:auto;">
      <table>
        <thead><tr><th style="width:30px;">Pos</th><th style="border-left:2px solid var(--navy);">Student</th><th style="text-align:right;border-left:2px solid var(--navy);">Total Marks</th><th style="text-align:right;border-left:2px solid var(--navy);">Total Points</th><th style="text-align:right;border-left:1px solid var(--navy-line);">Avg pts</th><th style="text-align:center;border-left:2px solid var(--navy);">Grade</th><th style="width:20px;"></th></tr></thead>
        <tbody>${tableRows}</tbody>
      </table>

}

/* =========================================================
   TAB: TERMS
========================================================= */
function renderTerms(){
  const byTerm = {};
  TERMS.forEach(t => {
    const matches = state.assessments.filter(a=>a.term===t);
    byTerm[t] = matches.length ? matches.reduce((a,b)=>a.createdAt>b.createdAt?a:b) : null;
  });

  const icons = TERMS.map(t => {
    const active = ui.selectedTerm===t;
    const has = !!byTerm[t];
    return `<button class="term-icon ${active?'active':''}" onclick="ui.selectedTerm='${t}'; render();">
      ${icon("calendar", 18)}
      <span>${t}</span>
      ${!has?'<small>No data</small>':''}
    </button>`;
  }).join("");

  const termAsm = byTerm[ui.selectedTerm];
  let termSection;
  if(!termAsm){
    termSection = `<div class="empty"><p>No assessment recorded for ${ui.selectedTerm} yet. Add one from the Assessment tab and tag it ${ui.selectedTerm}.</p></div>`;
  }else{
    const rows = computeRows(state.students, termAsm);
    const sortedTermRows = [...rows].sort((a,b)=>a.position-b.position);
    const trows = sortedTermRows.map((r,idx) => `<tr class="${idx%2?'zebra':''}">
      <td>${positionBadge(r.position, rows.length)}</td>
      <td style="border-left:2px solid var(--navy);"><div style="display:flex;align-items:center;gap:8px;">${avatarHTML(r.photo,r.name,22)}<span style="font-weight:600;">${esc(r.name)}</span></div></td>
      <td style="text-align:right;font-weight:600;border-left:2px solid var(--navy);">${r.totalMarks||0}</td>
      <td style="text-align:right;font-weight:600;border-left:2px solid var(--navy);">${r.totalPoints||0}/${SUBJECTS.length*8}</td>
      <td style="text-align:right;color:var(--navy-soft);border-left:1px solid var(--navy-line);">${r.avgPoints!==null?r.avgPoints.toFixed(2):"\u2014"}</td>
      <td style="text-align:center;border-left:2px solid var(--navy);">${gradePill(r.grade)}</td>
      <td style="text-align:center;"><button style="background:none;border:none;cursor:pointer;color:var(--navy-soft);" onclick="openReport('${r.studentId}')" title="Download report">${icon("download",14)}</button></td>
    </tr>`).join("");
    termSection = `<div style="border:1px solid var(--navy-line);border-radius:2px;overflow-x:auto;margin-bottom:30px;">
      <p style="font-size:11px;color:var(--navy-soft);padding:10px 10px 0;">${esc(termAsm.name)} \u00b7 ${rows.length} learners</p>
      <table style="margin-top:6px;"><thead><tr><th style="width:30px;">Pos</th><th style="border-left:2px solid var(--navy);">Student</th><th style="text-align:right;border-left:2px solid var(--navy);">Total Marks</th><th style="text-align:right;border-left:2px solid var(--navy);">Total Points</th><th style="text-align:right;border-left:1px solid var(--navy-line);">Avg pts</th><th style="text-align:center;border-left:2px solid var(--navy);">Grade</th><th style="width:20px;"></th></tr></thead>
      <tbody>${trows}</tbody></table></div>`;
  }

  // Year overview
  const perTermRows = {};
  TERMS.forEach(t => perTermRows[t] = computeRows(state.students, byTerm[t]));
  const yearRows = state.students.map(stu => {
    const marksByTerm = {}; let sum=0, count=0;
    TERMS.forEach(t => {
      const r = perTermRows[t].find(x=>x.studentId===stu.id);
      const marks = r ? r.totalMarks : null;
      marksByTerm[t] = marks;
      if(marks!==null && marks!==undefined && byTerm[t]){ sum+=marks; count++; }
    });
    return {studentId:stu.id, name:stu.name, marksByTerm, yearAvg: count>0 ? sum/count : null};
  }).sort((a,b)=>(b.yearAvg||0)-(a.yearAvg||0));
  yearRows.forEach((r,i)=>r.position=i+1);

  const yearChartData = TERMS.map(t => {
    const rows = perTermRows[t];
    const vals = rows.map(r=>r.totalMarks).filter(v=>v!==null&&v!==undefined);
    return {term:t, average: vals.length ? Number((vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1)) : 0};
  });

  const yearTableRows = yearRows.map((r,idx) => `<tr class="${idx%2?'zebra':''}">
    <td>${r.position}</td>
    <td style="font-weight:600;">${esc(r.name)}</td>
    ${TERMS.map(t => `<td style="text-align:right;color:var(--navy-soft);">${r.marksByTerm[t]!==null&&r.marksByTerm[t]!==undefined?r.marksByTerm[t]:"\u2014"}</td>`).join("")}
    <td style="text-align:right;font-weight:600;">${r.yearAvg!==null?r.yearAvg.toFixed(1):"\u2014"}</td>
  </tr>`).join("");

  return `
    <div class="term-icons">${icons}</div>
    ${termSection}
    <h3 style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--navy-soft);margin:0 0 12px;">Full Year Overview</h3>
    <div class="chart-card"><h3>Class average total marks by term</h3>${barChart(yearChartData,"term","average")}</div>
    <div style="border:1px solid var(--navy-line);border-radius:2px;overflow-x:auto;margin-top:14px;">
      <table><thead><tr><th style="width:30px;">Pos</th><th>Student</th>${TERMS.map(t=>`<th style="text-align:right;">${t}</th>`).join("")}<th style="text-align:right;">Year avg</th></tr></thead>
      <tbody>${yearTableRows}</tbody></table>
    </div>`;
}

/* =========================================================
   TAB: COMPARE
========================================================= */
function renderCompare(){
  if(state.assessments.length<2){
    return `<div class="empty"><p>Add a second assessment to compare progress over time.</p></div>`;
  }
  if(!ui.compareA) ui.compareA = state.assessments[state.assessments.length-2].id;
  if(!ui.compareB) ui.compareB = state.assessments[state.assessments.length-1].id;
  const asmA = state.assessments.find(a=>a.id===ui.compareA);
  const asmB = state.assessments.find(a=>a.id===ui.compareB);
  const optsA = state.assessments.map(a=>`<option value="${a.id}" ${a.id===ui.compareA?"selected":""}>${esc(a.name)}</option>`).join("");
  const optsB = state.assessments.map(a=>`<option value="${a.id}" ${a.id===ui.compareB?"selected":""}>${esc(a.name)}</option>`).join("");

  const picker = `
    <div class="row" style="margin-bottom:20px;">
      <div class="row"><span class="field-label" style="margin:0;">From</span><select onchange="ui.compareA=this.value; render();">${optsA}</select></div>
      ${icon("arrows",16)}
      <div class="row"><span class="field-label" style="margin:0;">To</span><select onchange="ui.compareB=this.value; render();">${optsB}</select></div>
    </div>`;

  if(!asmA || !asmB) return picker;

  const rowsA = computeRows(state.students, asmA);
  const rowsB = computeRows(state.students, asmB);
  const movement = state.students.map(stu => {
    const ra = rowsA.find(r=>r.studentId===stu.id);
    const rb = rowsB.find(r=>r.studentId===stu.id);
    if(!ra || !rb) return null;
    return {name:stu.name, delta:(rb.totalMarks||0)-(ra.totalMarks||0), posDelta:(ra.position||0)-(rb.position||0), a:ra, b:rb};
  }).filter(Boolean).sort((x,y)=>y.delta-x.delta);

  const avgAData = state.students.map(stu => {
    const r = rowsA.find(x=>x.studentId===stu.id);
    return {name:stu.name.split(" ")[0], marks: r?r.totalMarks:0};
  });
  const avgBData = state.students.map(stu => {
    const r = rowsB.find(x=>x.studentId===stu.id);
    return {name:stu.name.split(" ")[0], marks: r?r.totalMarks:0};
  });

  const movementRows = movement.map((m,idx) => {
    const deltaClass = m.delta>0?"delta-up":m.delta<0?"delta-down":"delta-flat";
    const rankClass = m.posDelta>0?"delta-up":m.posDelta<0?"delta-down":"delta-flat";
    return `<tr class="${idx%2?'zebra':''}">
      <td style="font-weight:600;">${esc(m.name)}</td>
      <td style="text-align:right;color:var(--navy-soft);">${m.a.totalMarks}</td>
      <td style="text-align:right;font-weight:600;">${m.b.totalMarks}</td>
      <td style="text-align:right;color:var(--navy-soft);">${((m.a.totalMarks+m.b.totalMarks)/2).toFixed(1)}</td>
      <td style="text-align:right;" class="${deltaClass}">${m.delta>0?"+":""}${m.delta}</td>
      <td style="text-align:center;" class="${rankClass}">${m.posDelta===0?"\u2014":Math.abs(m.posDelta)}</td>
    </tr>`;
  }).join("");

  const averagedRows = computeAveragedRows(state.students, asmA, asmB);
  const sortedAvgRows = [...averagedRows].sort((a,b)=>a.position-b.position);
  const avgRankRows = sortedAvgRows.map((r,idx) => {
    const subjCells = r.perSubject.map(p => `<td style="text-align:center;">${p.pct===null?"\u2014":p.pct}</td>`).join("");
    return `<tr class="${idx%2?'zebra':''}">
      <td>${positionBadge(r.position, sortedAvgRows.length)}</td>
      <td style="font-weight:600;">${esc(r.name)}</td>
      ${subjCells}
      <td style="text-align:right;font-weight:700;">${r.totalMarks}</td>
      <td style="text-align:right;color:var(--navy-soft);">${r.avgPoints!==null?r.avgPoints.toFixed(2):"\u2014"}</td>
      <td style="text-align:center;">${gradePill(r.grade)}</td>
    </tr>`;
  }).join("");
  const subjHeaders = SUBJECTS.map(s=>`<th style="text-align:center;">${s.replace(" & ","&").slice(0,7)}</th>`).join("");

  return picker + `
    <div style="display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:20px;">
      <div class="chart-card"><h3>${esc(asmA.name)} \u2014 total marks</h3>${barChart(avgAData,"name","marks")}</div>
      <div class="chart-card"><h3>${esc(asmB.name)} \u2014 total marks</h3>${barChart(avgBData,"name","marks")}</div>
    </div>
    <div style="border:1px solid var(--navy-line);border-radius:2px;overflow-x:auto;">
      <table><thead><tr><th>Student</th><th style="text-align:right;">${esc(asmA.name)}</th><th style="text-align:right;">${esc(asmB.name)}</th><th style="text-align:right;">Average</th><th style="text-align:right;">Change</th><th style="text-align:center;">Rank move</th></tr></thead>
      <tbody>${movementRows}</tbody></table>
    </div>

    <h3 style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--navy-soft);margin:24px 0 10px;">Average Performance \u2014 Ranked (per subject)</h3>
    <p class="small-note">Each subject shown here is the average of that subject across both assessments, then ranked as its own result \u2014 not just an average of the two totals.</p>
    <div class="row" style="margin-bottom:10px;">
      <button class="btn outline sm" onclick="openAverageReport()">${icon("download",14)} Download Average Report</button>
    </div>
    <div style="border:1px solid var(--navy-line);border-radius:2px;overflow-x:auto;">
      <table style="font-size:10px;min-width:800px;">
        <thead><tr><th style="width:30px;">Pos</th><th>Student</th>${subjHeaders}<th style="text-align:right;">Total</th><th style="text-align:right;">Avg pts</th><th style="text-align:center;">Grade</th></tr></thead>
        <tbody>${avgRankRows}</tbody>
      </table>
    </div>`;
}

// Builds ONE PDF containing every learner's individual report, one
// learner per page, in class rank order \u2014 instead of downloading each
// student's report separately.
async function downloadAllLearnerReports(btnEl){
  const asm = state.assessments.find(a=>a.id===ui.selectedAssessmentId) || state.assessments[0];
  if(!asm){ showAlert("No assessment selected."); return; }
  const rows = computeRows(state.students, asm).sort((a,b)=>a.position-b.position);
  if(!rows.length){ showAlert("No learners to include."); return; }

  const originalHTML = btnEl ? btnEl.innerHTML : null;
  if(btnEl){ btnEl.disabled = true; }

  const stage = document.createElement("div");
  stage.style.cssText = "position:fixed;left:-99999px;top:0;background:#fff;width:680px;";
  document.body.appendChild(stage);

  try{
    if(typeof html2canvas === "undefined" || !window.jspdf){
      showAlert("PDF tools are still loading \u2014 please wait a few seconds and try again.");
      return;
    }
    const { jsPDF } = window.jspdf;
    let pdf = null;
    const pageW = 595.28, pageH = 841.89; // A4 portrait, matches individual report layout

    for(let i=0; i<rows.length; i++){
      if(btnEl) btnEl.innerHTML = `Preparing ${i+1} of ${rows.length}\u2026`;
      const cardHTML = buildStudentReportCardHTML(rows[i].studentId, {withButtons:false, elementId:"batchPrintable"});
      if(!cardHTML) continue;
      stage.innerHTML = cardHTML;
      await new Promise(r => setTimeout(r, 30)); // let the chart's SVG lay out
      const node = stage.querySelector("#batchPrintable");
      const canvas = await html2canvas(node, {scale:2, backgroundColor:"#ffffff", useCORS:true});
      const imgW = pageW;
      const imgH = (canvas.height * imgW) / canvas.width;
      const imgData = canvas.toDataURL("image/jpeg", 0.92);
      if(!pdf) pdf = new jsPDF({orientation:"portrait", unit:"pt", format:"a4"});
      else pdf.addPage("a4", "portrait");
      {
        const margin = 14;
        let drawW = imgW, drawH = imgH, x = 0, y = 0;
        if(imgH > pageH - margin*2){
          const s = (pageH - margin*2) / imgH;
          drawW = imgW * s; drawH = imgH * s;
          x = (pageW - drawW) / 2; y = margin;
        }
        pdf.addImage(imgData, "JPEG", x, y, drawW, drawH);
      }
    }

    const blob = pdf.output("blob");
    await saveFile(`${state.className.replace(/[^A-Za-z0-9]+/g,"_")}_All_Learner_Reports.pdf`, blob);
  }catch(e){
    showAlert("Couldn't create the combined report. Please try again.");
  } finally {
    document.body.removeChild(stage);
    if(btnEl){ btnEl.disabled = false; btnEl.innerHTML = originalHTML; }
  }
}

          <div><b style="color:var(--navy-soft);">CLASS TEACHER: </b>${esc(state.classTeacher||"\u2014")}</div>
          <div><b style="color:var(--navy-soft);">SIGN: </b>________________</div>
          <div style="text-align:right;">
            <div style="border:1px dashed var(--navy-line);border-radius:6px;width:110px;height:70px;margin-left:auto;display:flex;align-items:center;justify-content:center;color:var(--navy-soft);font-size:9px;text-transform:uppercase;letter-spacing:0.5px;">School Stamp</div>
          </div>
        </div>
      </div>
    </div>`;
}

/* =========================================================
   MAIN RENDER / TAB NAV
========================================================= */
const TABS = [
  {id:"roster", label:"Roster", icon:"users"},
  {id:"entry", label:"Enter Marks", icon:"pen"},
  {id:"assessment", label:"Assessment", icon:"bar"},
  {id:"terms", label:"Terms", icon:"calendar"},
  {id:"compare", label:"Compare", icon:"arrows"}
];
function renderNav(){
  document.getElementById("tabNav").innerHTML = TABS.map(t =>
    `<button class="${ui.activeTab===t.id?'active':''}" onclick="ui.activeTab='${t.id}'; render();">${icon(t.icon,15)} ${t.label}</button>`
  ).join("");
}
function render(){
  renderNav();
  document.getElementById("headerSubtitle").textContent = "BOSIANGO 2026 Assessment \u2014 " + state.className;
  document.getElementById("gradeSelectorRow").innerHTML = `
    <label style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--navy-soft);margin-right:8px;">Grade</label>
    <select onchange="switchGrade(this.value)" style="font-weight:700;">
      ${GRADES.map(g => `<option value="${g}" ${g===state.currentGrade?"selected":""}>${g}</option>`).join("")}
    </select>`;
  let html = "";
  if(ui.activeTab==="roster") html = renderRoster();
  else if(ui.activeTab==="entry") html = renderEntry();
  else if(ui.activeTab==="assessment") html = renderAssessment();
  else if(ui.activeTab==="terms") html = renderTerms();
  else if(ui.activeTab==="compare") html = renderCompare();
  document.getElementById("mainContent").innerHTML = html;

  const logoImg = document.getElementById("logoImg");
  const logoPh = document.getElementById("logoPlaceholderIcon");
  if(state.schoolLogo){ logoImg.src = state.schoolLogo; logoImg.style.display="block"; logoPh.style.display="none"; }
  else { logoImg.style.display="none"; logoPh.style.display="block"; }
}
function persistAndRender(){ scheduleSave(); render(); }
// Updates just the "X of Y entered \u00b7 class average Z%" line on the Entry
// tab without touching the input rows themselves \u2014 used so committing
// one mark doesn't force a full-page rebuild (recompute ranks, redraw
// both charts, rebuild every row) each time, which is what made mark
// entry feel slow on bigger classes.
// Lets a teacher enter marks for a whole learning area without lifting
// a finger to tap each row: pressing Enter/Next on one mark jumps
// straight into the next student's field, already selected and ready
// to type over.
function focusNextEntryInput(currentIdx){
  const next = document.querySelector(`input[data-entry-idx="${currentIdx+1}"]`);
  if(next){ next.focus(); if(next.select) next.select(); }
}
function refreshEntrySummary(){
  if(ui.activeTab!=="entry") return false;
  const asm = state.assessments.find(a=>a.id===ui.selectedAssessmentId);
  const el = document.getElementById("entrySummaryLine");
  if(!asm || !el) return false;
  let filled=0, count=0, sum=0;
  state.students.forEach(stu => {
    const val = (asm.scores[stu.id]||{})[ui.mySubject];
    if(val!==undefined && val!==null && val!==""){ filled++; sum+=Number(val); count++; }
  });
  const avg = count ? (sum/count).toFixed(1) : null;
  el.textContent = `${filled} of ${state.students.length} entered${avg!==null ? " \u00b7 class average "+avg+"%" : ""}`;
  return true;
}

/* =========================================================
   FILE INPUT HANDLERS
========================================================= */
document.getElementById("csvInput").addEventListener("change", e => {
  const file = e.target.files[0];
  if(file) handleCSVUpload(file);
  e.target.value = "";
});
document.getElementById("photoInput").addEventListener("change", e => {
  const file = e.target.files[0];
  const studentId = window.__photoTarget;
  if(!file || !studentId){ e.target.value=""; return; }
  const reader = new FileReader();
  reader.onload = () => {
    const s = state.students.find(s=>s.id===studentId);
    if(s){ s.photo = reader.result; persistAndRender(); }
  };
  reader.readAsDataURL(file);
  e.target.value = "";
});
document.getElementById("logoBadge").addEventListener("click", () => document.getElementById("logoInput").click());
document.getElementById("logoInput").addEventListener("change", e => {
  const file = e.target.files[0];
  if(!file){ e.target.value=""; return; }
  const reader = new FileReader();
  reader.onload = () => { state.schoolLogo = reader.result; persistAndRender(); };
  reader.readAsDataURL(file);
  e.target.value = "";
});
document.getElementById("importInput").addEventListener("change", e => {
  const file = e.target.files[0];
  if(file) importData(file);
  e.target.value = "";
});

/* =========================================================
   INIT
========================================================= */
/* =========================================================
   APP LOCK \u2014 a soft screen-lock stored only on this device.
   Keeps casual browsers (students, parents) out; not strong
   security, since the sync connection details live in this
   same file either way.
========================================================= */
function getLockPassword(){
  try{ return localStorage.getItem(LOCK_KEY) || ""; }catch(e){ return ""; }
}
function setLockPassword(pw){
  try{ localStorage.setItem(LOCK_KEY, pw); }catch(e){}
}
function clearLockPassword(){
  try{ localStorage.removeItem(LOCK_KEY); }catch(e){}
}
function showLockScreen(onUnlock){
  document.getElementById("lockRoot").innerHTML = `
    <div class="modal-overlay" style="background:#fff;">
      <div class="modal-box" style="text-align:center;">
        <div style="display:flex;justify-content:center;margin-bottom:14px;">
          <div style="width:48px;height:48px;border-radius:50%;border:2px solid var(--navy);display:flex;align-items:center;justify-content:center;color:var(--navy);">
            ${icon("alert",22)}
          </div>
        </div>
        <p style="font-weight:700;color:var(--navy);margin:0 0 4px;">BOSIANGO COMPREHENSIVE SCHOOL</p>
        <p class="small-note" style="margin-bottom:16px;">Enter password to open the tracker</p>
        <input type="password" id="lockPwInput" placeholder="Password" style="width:100%;text-align:center;margin-bottom:10px;">
        <p id="lockError" style="color:var(--be);font-size:12px;min-height:16px;margin:0 0 10px;"></p>
        <button class="btn" style="width:100%;" onclick="attemptUnlock()">Unlock</button>
      </div>
    </div>`;
  window.__onUnlock = onUnlock;
  setTimeout(() => {
    const f = document.getElementById("lockPwInput");
    if(f){ f.focus(); f.addEventListener("keydown", e => { if(e.key==="Enter") attemptUnlock(); }); }
  }, 0);
}
function attemptUnlock(){
  const entered = document.getElementById("lockPwInput").value;
  if(entered === getLockPassword()){
    document.getElementById("lockRoot").innerHTML = "";
    if(window.__onUnlock) window.__onUnlock();
  } else {
    document.getElementById("lockError").textContent = "Incorrect password. Try again.";
    document.getElementById("lockPwInput").value = "";
    document.getElementById("lockPwInput").focus();
  }
}
function setAppLock(){
  showInput("Set App Lock Password", "New password", (pw) => {
    if(!pw){ showAlert("Password can't be empty."); return; }
    setLockPassword(pw);
    render();
    showAlert("App lock set. You'll need this password next time you open the tracker on this device.");
  });
}
function removeAppLock(){
  const current = getLockPassword();
  if(!current){ showAlert("No app lock is currently set."); return; }
  showInput("Remove App Lock", "Enter current password to confirm", (pw) => {
    if(pw !== current){ showAlert("Incorrect password \u2014 app lock not removed."); return; }
    clearLockPassword();
    render();
    showAlert("App lock removed from this device.");
  });
}

async function startApp(){
  const saved = loadState();
  if(saved && saved.grades && Object.keys(saved.grades).length){
    state = Object.assign({currentGrade:"Grade 6", grades:{}, schoolLogo:null, students:[], assessments:[], className:"Grade 6", subjectTeachers:{}}, saved);
    SUBJECTS = subjectsForGrade(state.currentGrade);
    if(!state.grades[state.currentGrade]) state.grades[state.currentGrade] = defaultGradeData(state.currentGrade);
    syncActiveGradeFromStore();
    dedupeStudentsByName();
    saveActiveGradeToStore();
    ui.selectedAssessmentId = state.assessments.length ? state.assessments[state.assessments.length-1].id : null;
    render();
    initSync().then(() => { if(backfillMissingRosters()) render(); });
  } else {
    SUBJECTS = subjectsForGrade(state.currentGrade);
    await bootstrapFromCloudOrSeed();
    dedupeStudentsByName();
    saveActiveGradeToStore();
    ui.selectedAssessmentId = state.assessments.length ? state.assessments[state.assessments.length-1].id : null;
    backfillMissingRosters();
    render();
  }
}
if(getLockPassword()){
  showLockScreen(startApp);
} else {
  startApp();
}
</script>
